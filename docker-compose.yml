services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      SQLITE_PATH: /data/app.db
    volumes:
      - ./data:/data
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8085:80"
    restart: unless-stopped
